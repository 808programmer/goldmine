{% extends 'index.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6 text-center text-black dark:text-white">Gold Prediction Tool</h1>
    
    <div class="max-w-2xl mx-auto bg-white dark:bg-zinc-800 rounded-lg shadow-md p-6">

        
        <!-- Dataset Training Section (Hidden by default) -->
        <div id="datasetTrainingSection" class="mb-6 p-4 bg-gray-50 dark:bg-zinc-700 rounded-md hidden">
            <h3 class="text-lg font-medium mb-2 dark:text-white">Train Model with Dataset</h3>
            <p id="datasetInfo" class="text-sm text-gray-600 dark:text-gray-300 mb-3"></p>
            <div class="flex justify-between items-center">
                <button id="trainModelBtn" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none">
                    <span class="mr-1">🧠</span> Train Model Now
                </button>
                <button id="closeTrainingBtn" class="text-gray-500 dark:text-gray-300 hover:text-gray-700 dark:hover:text-gray-100">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div id="trainingResult" class="mt-3 hidden"></div>
        </div>
        
        <hr class="my-5 border-gray-200 dark:border-gray-600">
        
        <form id="prediction-form" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="latitude" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Latitude</label>
                    <input type="number" step="0.000001" id="latitude" name="latitude" required
                           class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white text-black dark:bg-zinc-700 text-black dark:text-white"
                           placeholder="e.g., 4.5">
                </div>
                <div>
                    <label for="longitude" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Longitude</label>
                    <input type="number" step="0.000001" id="longitude" name="longitude" required
                           class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white text-black dark:bg-zinc-700 dark:text-white"
                           placeholder="e.g., -59.0">
                </div>
            </div>
            
            <div>
                <label for="elevation" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Elevation (meters)</label>
                <input type="number" id="elevation" name="elevation" required
                       class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white text-black dark:bg-zinc-700 dark:text-white"
                       placeholder="e.g., 450">
            </div>
            
            <div>
                <label for="soil_type" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Soil Type</label>
                <select id="soil_type" name="soil_type" required
                        class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white text-black dark:bg-zinc-700 dark:text-white">
                    <option value="" disabled selected>Select soil type</option>
                    <option value="alluvial">Alluvial</option>
                    <option value="laterite">Laterite</option>
                    <option value="sandy">Sandy</option>
                    <option value="clay">Clay</option>
                </select>
            </div>
            
            <div>
                <label for="geological_formation" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Geological Formation</label>
                <select id="geological_formation" name="geological_formation" required
                        class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-600 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 bg-white text-black dark:bg-zinc-700 dark:text-white">
                    <option value="" disabled selected>Select geological formation</option>
                    <option value="greenstone">Greenstone</option>
                    <option value="granite">Granite</option>
                    <option value="sedimentary">Sedimentary</option>
                    <option value="metamorphic">Metamorphic</option>
                </select>
            </div>
            
            <div class="pt-4">
                <button type="submit"
                        class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Predict Gold Presence
                </button>
            </div>
        </form>
        
        <div id="result" class="mt-6 hidden">
            <h2 class="text-xl font-semibold mb-2 dark:text-white">Prediction Result</h2>
            <div class="p-4 rounded-md bg-gray-50 dark:bg-zinc-700">
                <div class="flex justify-between">
                    <span class="text-gray-800 dark:text-gray-300">Gold Probability:</span>
                    <span id="probability" class="font-medium text-black dark:text-white"></span>
                </div>
                <div class="flex justify-between mt-2">
                    <span class="text-gray-700 dark:text-gray-300">Confidence:</span>
                    <span id="confidence" class="font-medium text-black dark:text-white"></span>
                </div>
                <div class="flex justify-between mt-2">
                    <span class="text-gray-700 dark:text-gray-300">Model Type:</span>
                    <span id="model-type" class="font-medium text-black dark:text-white"></span>
                </div>
                <div class="mt-4">
                    <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5">
                        <div id="probability-bar" class="bg-yellow-500 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                <div class="mt-4">
                    <div id="interpretation" class="text-sm italic text-gray-600 dark:text-gray-300"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="max-w-4xl mx-auto mt-12">
        <h2 class="text-2xl font-bold mb-4 text-black dark:text-white">Recent Predictions</h2>
        <div class="bg-white dark:bg-zinc-800 rounded-lg shadow-md overflow-hidden">
            <div class="overflow-y-auto max-h-60 scrollbar-thin scrollbar-thumb-gray-400 scrollbar-track-gray-100">
                <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                    <thead class="bg-gray-100 dark:bg-zinc-700 sticky top-0">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Location</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Soil Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Geological Formation</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Probability</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Date</th>
                        </tr>
                    </thead>
                    <tbody id="history-table" class="divide-y divide-gray-200 dark:divide-gray-700 dark:text-gray-200">
                        <!-- History items will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Check if we have a dataset ID in the URL
        const urlParams = new URLSearchParams(window.location.search);
        const datasetId = urlParams.get('dataset');
        
        if (datasetId) {
            // Show the dataset training section
            const trainingSection = document.getElementById('datasetTrainingSection');
            trainingSection.classList.remove('hidden');
            
            // Fetch dataset info
            fetch(`/api/enhanced-predictions/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('datasetInfo').textContent = 
                        `Dataset: ${data.name} (${data.rows_count} rows)`;
                })
                .catch(error => {
                    console.error('Error fetching dataset:', error);
                });
                
            // Set up training button
            const trainBtn = document.getElementById('trainModelBtn');
            const closeBtn = document.getElementById('closeTrainingBtn');
            const trainingResult = document.getElementById('trainingResult');
            
            trainBtn.addEventListener('click', function() {
                // Update button state
                const originalText = trainBtn.innerHTML;
                trainBtn.disabled = true;
                trainBtn.innerHTML = '<span class="mr-1">⏳</span> Training...';
                
                // Send training request
                fetch('/train-model/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ dataset_id: datasetId })
                })
                .then(response => response.json())
                .then(data => {
                    trainBtn.disabled = false;
                    trainBtn.innerHTML = originalText;
                    
                    if (data.success) {
                        trainingResult.classList.remove('hidden');
                        // Use colors that work in both light and dark modes
                        const isDarkMode = document.documentElement.classList.contains('dark');
                        if (isDarkMode) {
                            trainingResult.classList.add('bg-green-900', 'text-green-100', 'p-3', 'rounded');
                        } else {
                            trainingResult.classList.add('bg-green-100', 'text-green-800', 'p-3', 'rounded');
                        }
                        
                        // Build success message with metrics
                        let resultHtml = `<p>✅ ${data.message}</p>`;
                        
                        // Create metrics table with dark mode friendly borders
                        const borderColor = isDarkMode ? 'border-green-700' : 'border-green-200';
                        resultHtml += `<div class="mt-2 text-xs">
                            <div class="flex justify-between border-b ${borderColor} py-1">
                                <span>Accuracy:</span>
                                <span class="font-medium">${(data.accuracy * 100).toFixed(2)}%</span>
                            </div>`;
                            
                        // Add F1 score if available
                        if (data.f1_score !== null) {
                            resultHtml += `<div class="flex justify-between border-b ${borderColor} py-1">
                                <span>F1 Score:</span>
                                <span class="font-medium">${(data.f1_score * 100).toFixed(2)}%</span>
                            </div>`;
                        }
                        
                        // Add model type if available
                        if (data.model_type) {
                            resultHtml += `<div class="flex justify-between py-1">
                                <span>Model Type:</span>
                                <span class="font-medium">${data.model_type}</span>
                            </div>`;
                        }
                        
                        resultHtml += `</div>
                            <p class="text-sm mt-2">You can now make predictions using the trained model.</p>`;
                            
                        trainingResult.innerHTML = resultHtml;
                    } else {
                        trainingResult.classList.remove('hidden');
                        // Use colors that work in both light and dark modes
                        const isDarkMode = document.documentElement.classList.contains('dark');
                        if (isDarkMode) {
                            trainingResult.classList.add('bg-red-900', 'text-red-100', 'p-3', 'rounded');
                        } else {
                            trainingResult.classList.add('bg-red-100', 'text-red-800', 'p-3', 'rounded');
                        }
                        trainingResult.textContent = `❌ Error: ${data.error || 'Training failed'}`;
                    }
                })
                .catch(error => {
                    trainBtn.disabled = false;
                    trainBtn.innerHTML = originalText;
                    trainingResult.classList.remove('hidden');
                    
                    // Use colors that work in both light and dark modes
                    const isDarkMode = document.documentElement.classList.contains('dark');
                    if (isDarkMode) {
                        trainingResult.classList.add('bg-red-900', 'text-red-100', 'p-3', 'rounded');
                    } else {
                        trainingResult.classList.add('bg-red-100', 'text-red-800', 'p-3', 'rounded');
                    }
                    
                    trainingResult.textContent = `❌ Error: ${error.message}`;
                    console.error('Error:', error);
                });
            });
            
            closeBtn.addEventListener('click', function() {
                trainingSection.classList.add('hidden');
                // Also remove the dataset ID from the URL
                window.history.replaceState({}, document.title, window.location.pathname);
            });
        }
    
        // Load prediction history on page load
        fetchPredictionHistory();
        
        // Handle form submission
        const form = document.getElementById('prediction-form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const formData = {
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                elevation: parseFloat(document.getElementById('elevation').value),
                soil_type: document.getElementById('soil_type').value,
                geological_formation: document.getElementById('geological_formation').value
            };
            
            // Send prediction request
            fetch('/api/enhanced-predictions/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(`Error: ${data.error}`);
                    return;
                }
                
                // Display result
                document.getElementById('result').classList.remove('hidden');
                document.getElementById('probability').textContent = `${(data.probability * 100).toFixed(2)}%`;
                document.getElementById('confidence').textContent = `${(data.confidence * 100).toFixed(2)}%`;
                document.getElementById('probability-bar').style.width = `${data.probability * 100}%`;
                
                // Display model type if available
                if (data.model_type) {
                    document.getElementById('model-type').textContent = data.model_type;
                } else {
                    document.getElementById('model-type').textContent = 'Not specified';
                }
                
                // Add interpretation text based on probability
                const interpretationEl = document.getElementById('interpretation');
                let interpretationText = '';
                
                if (data.probability > 0.75) {
                    interpretationText = 'Very high likelihood of gold present. This location is worth investigating thoroughly.';
                    document.getElementById('probability-bar').classList.remove('bg-yellow-300', 'bg-yellow-400', 'bg-yellow-500');
                    document.getElementById('probability-bar').classList.add('bg-yellow-600');
                } else if (data.probability > 0.5) {
                    interpretationText = 'Good likelihood of gold present. Consider this location for exploration.';
                    document.getElementById('probability-bar').classList.remove('bg-yellow-300', 'bg-yellow-400', 'bg-yellow-600');
                    document.getElementById('probability-bar').classList.add('bg-yellow-500');
                } else if (data.probability > 0.25) {
                    interpretationText = 'Moderate likelihood of gold present. May warrant some investigation.';
                    document.getElementById('probability-bar').classList.remove('bg-yellow-300', 'bg-yellow-500', 'bg-yellow-600');
                    document.getElementById('probability-bar').classList.add('bg-yellow-400');
                } else {
                    interpretationText = 'Low likelihood of gold present. Consider other locations first.';
                    document.getElementById('probability-bar').classList.remove('bg-yellow-400', 'bg-yellow-500', 'bg-yellow-600');
                    document.getElementById('probability-bar').classList.add('bg-yellow-300');
                }
                
                interpretationEl.textContent = interpretationText;
                
                // Refresh history
                fetchPredictionHistory();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while making the prediction. Please try again.');
            });
        });
        
        // Function to fetch prediction history
        function fetchPredictionHistory() {
            fetch('/api/enhanced-predictions/')
            .then(response => response.json())
            .then(data => {
                const historyTable = document.getElementById('history-table');
                historyTable.innerHTML = '';
                
                if (data.length === 0) {
                    const emptyRow = document.createElement('tr');
                    emptyRow.innerHTML = `
                        <td colspan="5" class="px-6 py-4 text-center text-gray-500 dark:text-gray-400">
                            No prediction history available
                        </td>
                    `;
                    historyTable.appendChild(emptyRow);
                    return;
                }
                
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 dark:hover:bg-zinc-700 transition-colors";
                    
                    const formatDate = (dateString) => {
                        const date = new Date(dateString);
                        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
                    };
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap">(${item.latitude.toFixed(4)}, ${item.longitude.toFixed(4)})</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.soil_type}</td>
                        <td class="px-6 py-4 whitespace-nowrap">${item.geological_formation}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="mr-2">${(item.probability * 100).toFixed(2)}%</div>
                                <div class="w-16 bg-gray-200 dark:bg-gray-600 rounded-full h-1.5">
                                    <div class="bg-yellow-500 h-1.5 rounded-full" style="width: ${item.probability * 100}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">${formatDate(item.created_at)}</td>
                    `;
                    
                    historyTable.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error fetching history:', error);
            });
        }
        
        // Function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    });
</script>
{% endblock %}
