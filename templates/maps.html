{% block extra_js %}
<script>
    // Pass Mapbox API key from Django to JavaScript
    window.MAPBOX_API_KEY = '{{ mapbox_api_key }}';
</script>
<script src="{% static 'js/map_handler.js' %}"></script>
<script src="{% static 'js/cesium_map.js' %}"></script>
<script>
    // Global variables for map coordinates
    let mapCoordinates = [];
    let currentMap = null;

    // Map view toggle handler
    document.addEventListener('DOMContentLoaded', function() {
        const mapViewSelector = document.getElementById('map-view-selector');
        const map2DContainer = document.getElementById('map-container-2d');
        const map3DContainer = document.getElementById('map-container-3d');
        
        if (mapViewSelector && map2DContainer && map3DContainer) {
            console.log('Map view selector and containers found');
            
            // Function to handle view changes
            function changeMapView(selectedValue) {
                console.log('Changing map view to:', selectedValue);
                
                // Hide all map containers
                map2DContainer.style.display = 'none';
                map3DContainer.style.display = 'none';
                
                // Show the selected map container
                if (selectedValue === '2d') {
                    map2DContainer.style.display = 'block';
                    // Trigger resize event for Mapbox
                    window.dispatchEvent(new Event('resize'));
                } else if (selectedValue === '3d') {
                    map3DContainer.style.display = 'block';
                    // Trigger resize event for Mapbox
                    window.dispatchEvent(new Event('resize'));
                }
            }
            
            // Add change event listener
            mapViewSelector.addEventListener('change', function() {
                changeMapView(mapViewSelector.value);
            });
            
            // Initialize with the selected view
            changeMapView(mapViewSelector.value);
        } else {
            console.error('Could not find map containers or selector');
        }

        // LLM Analysis functionality
        setupLLMAnalysis();
        
        // Mineralization Trends functionality
        setupMineralizationTrends();
        
        // Map refresh functionality
        setupMapRefresh();
    });

    function setupLLMAnalysis() {
        const analyzeBtn = document.getElementById('analyze-texts-btn');
        const loadCoordinatesBtn = document.getElementById('load-coordinates-btn');
        const generatePredictionsBtn = document.getElementById('generate-predictions-btn');
        const analyzeAndTrainBtn = document.getElementById('analyze-and-train-btn');
        const statusDiv = document.getElementById('analysis-status');

        // Check if all required elements exist
        if (!analyzeBtn || !loadCoordinatesBtn || !generatePredictionsBtn || !analyzeAndTrainBtn || !statusDiv) {
            console.warn('Some LLM analysis elements not found, skipping setup');
            return;
        }

        analyzeBtn.addEventListener('click', async function() {
            const limit = document.getElementById('analysis-limit').value;
            const reprocess = document.getElementById('reprocess-checkbox').checked;

            statusDiv.innerHTML = '<span class="text-blue-600">Analyzing text files with AI...</span>';
            analyzeBtn.disabled = true;

            try {
                const response = await fetch('/api/analyze-texts-for-map/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        limit: parseInt(limit),
                        reprocess: reprocess
                    })
                });

                const data = await response.json();

                if (data.success) {
                    mapCoordinates = data.coordinates;
                    statusDiv.innerHTML = `<span class="text-green-600">${data.message}</span>`;
                    
                    // Add coordinates to map
                    addCoordinatesToMap(mapCoordinates);
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">Error: ${data.error}</span>`;
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<span class="text-red-600">Error analyzing files</span>';
            } finally {
                analyzeBtn.disabled = false;
            }
        });

        loadCoordinatesBtn.addEventListener('click', async function() {
            statusDiv.innerHTML = '<span class="text-blue-600">Loading existing coordinates...</span>';
            loadCoordinatesBtn.disabled = true;

            try {
                const response = await fetch('/api/map-coordinates/');
                const data = await response.json();

                if (data.success) {
                    mapCoordinates = data.coordinates;
                    statusDiv.innerHTML = `<span class="text-green-600">Loaded ${data.total_points} coordinates</span>`;
                    
                    // Add coordinates to map
                    addCoordinatesToMap(mapCoordinates);
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">Error: ${data.error}</span>`;
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<span class="text-red-600">Error loading coordinates</span>';
            } finally {
                loadCoordinatesBtn.disabled = false;
            }
        });

        generatePredictionsBtn.addEventListener('click', async function() {
            statusDiv.innerHTML = '<span class="text-blue-600">Generating gold predictions from LLM data...</span>';
            generatePredictionsBtn.disabled = true;

            try {
                const response = await fetch('/api/enhanced-predictions/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        limit: 10  // Process up to 10 features
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = `<span class="text-green-600">${data.message}</span>`;
                    
                    // Refresh the map to show new predictions
                    if (currentMap) {
                        // Remove existing prediction layers
                        if (currentMap.getSource('gold-predictions')) {
                            currentMap.removeLayer('gold-predictions-heat');
                            currentMap.removeLayer('gold-predictions-points');
                            currentMap.removeSource('gold-predictions');
                        }
                        
                        // Reload predictions
                        loadGoldPredictions(currentMap);
                    }
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">Error: ${data.error}</span>`;
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<span class="text-red-600">Error generating gold predictions</span>';
            } finally {
                generatePredictionsBtn.disabled = false;
            }
        });

        analyzeAndTrainBtn.addEventListener('click', async function() {
            const limit = document.getElementById('analysis-limit').value;
            const reprocess = document.getElementById('reprocess-checkbox').checked;
            const apiKey = document.getElementById('openai-api-key').value;
            
            statusDiv.innerHTML = '<span class="text-blue-600">Analyzing and training model with OpenAI...</span>';
            analyzeAndTrainBtn.disabled = true;

            try {
                const response = await fetch('/train-model/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        limit: parseInt(limit),
                        reprocess: reprocess,
                        api_key: apiKey || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = `<span class="text-green-600">${data.message}</span>`;
                    
                    // Refresh the map to show new predictions
                    if (currentMap) {
                        // Remove existing prediction layers
                        if (currentMap.getSource('gold-predictions')) {
                            currentMap.removeLayer('gold-predictions-heat');
                            currentMap.removeLayer('gold-predictions-points');
                            currentMap.removeSource('gold-predictions');
                        }
                        
                        // Reload predictions
                        loadGoldPredictions(currentMap);
                    }
                    
                    // Update training status
                    updateTrainingStatus();
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">Error: ${data.error}</span>`;
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<span class="text-red-600">Error analyzing and training model</span>';
            } finally {
                analyzeAndTrainBtn.disabled = false;
            }
        });
    }

    function addCoordinatesToMap(coordinates) {
        console.log('Adding coordinates to map:', coordinates);
        
        // This function will be implemented based on your map library
        // For now, we'll just log the coordinates
        coordinates.forEach(coord => {
            console.log(`Coordinate: ${coord.latitude}, ${coord.longitude} - Confidence: ${coord.confidence}`);
        });

        // TODO: Add actual map integration here
        // You'll need to modify your map_handler.js to accept and display these coordinates
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Fetch and display survey results
    fetch('/api/map-coordinates/')
        .then(response => response.json())
        .then(data => {
            const surveyContent = document.getElementById('survey-content');
            if (data.success && data.features && data.features.length > 0) {
                let html = '<ul>';
                data.features.forEach(feature => {
                    html += `<li class="mb-4">
                        <h4 class="font-bold">${feature.name}</h4>
                        <p>Type: ${feature.feature_type}</p>
                        <p>Location: ${feature.latitude}, ${feature.longitude}</p>
                        <p>Description: ${feature.description}</p>
                        <p>Gold Probability: ${(feature.gold_probability * 100).toFixed(1)}%</p>
                    </li>`;
                });
                html += '</ul>';
                surveyContent.innerHTML = html;
            } else {
                surveyContent.innerHTML = 'No geological features available.';
            }
        })
        .catch(error => {
            console.error('Error fetching geological features:', error);
            document.getElementById('survey-content').innerHTML = 'Error loading geological features.';
        });

    // Function to update training status
    async function updateTrainingStatus() {
        try {
            const trainingStatusElement = document.getElementById('training-status');
            if (!trainingStatusElement) {
                console.warn('Training status element not found');
                return;
            }
            
            const response = await fetch('/api/enhanced-predictions/');
            const data = await response.json();
            
            if (data.success) {
                const predictions = data.predictions || [];
                const statusHtml = `
                    <div class="text-sm">
                        <div>Predictions: ${predictions.length}</div>
                        <div>Model: ${predictions.length > 0 ? 'Active' : 'No predictions available'}</div>
                    </div>
                `;
                trainingStatusElement.innerHTML = statusHtml;
            }
        } catch (error) {
            console.error('Error updating training status:', error);
        }
    }
    
    // Load initial training status
    updateTrainingStatus();

    // Setup mineralization trends controls
    function setupMineralizationTrends() {
        const generateTrendsBtn = document.getElementById('generate-trends-btn');
        const clearTrendsBtn = document.getElementById('clear-trends-btn');
        const toggleTrendsBtn = document.getElementById('toggle-trends-btn');
        const trendTypeSelect = document.getElementById('trend-type');
        const confidenceThreshold = document.getElementById('confidence-threshold');
        const confidenceValue = document.getElementById('confidence-value');
        const maxTrendsInput = document.getElementById('max-trends');
        const statusDiv = document.getElementById('trend-status');
        
        // Check if all required elements exist
        if (!generateTrendsBtn || !clearTrendsBtn || !toggleTrendsBtn || !trendTypeSelect || 
            !confidenceThreshold || !confidenceValue || !maxTrendsInput || !statusDiv) {
            console.warn('Some mineralization trends elements not found, skipping setup');
            return;
        }
        
        let trendsVisible = true;
        
        // Update confidence value display
        confidenceThreshold.addEventListener('input', function() {
            confidenceValue.textContent = this.value + '%';
        });
        
        // Generate trends button
        generateTrendsBtn.addEventListener('click', async function() {
            const trendType = trendTypeSelect.value;
            const confidence = confidenceThreshold.value / 100;
            const maxTrends = maxTrendsInput.value;
            
            statusDiv.innerHTML = '<span class="text-blue-600">Generating mineralization trends...</span>';
            generateTrendsBtn.disabled = true;
            
            try {
                const url = `/api/mineralization-trends/?type=${trendType}&confidence=${confidence}&max_trends=${maxTrends}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = `<span class="text-green-600">Generated ${data.trends.length} trends from ${data.total_features_analyzed} geological features</span>`;
                    
                    // Update trends on all active maps
                    updateTrendsOnMaps(data.trends);
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">Error: ${data.error}</span>`;
                }
            } catch (error) {
                console.error('Error generating trends:', error);
                statusDiv.innerHTML = '<span class="text-red-600">Error generating trends</span>';
            } finally {
                generateTrendsBtn.disabled = false;
            }
        });
        
        // Clear trends button
        clearTrendsBtn.addEventListener('click', function() {
            clearTrendsOnMaps();
            statusDiv.innerHTML = '<span class="text-gray-600">Trends cleared</span>';
        });
        
        // Toggle visibility button
        toggleTrendsBtn.addEventListener('click', function() {
            trendsVisible = !trendsVisible;
            toggleTrendsVisibility(trendsVisible);
            toggleTrendsBtn.textContent = trendsVisible ? 'Hide Trends' : 'Show Trends';
            statusDiv.innerHTML = `<span class="text-blue-600">Trends ${trendsVisible ? 'shown' : 'hidden'}</span>`;
        });
    }
    
    // Update trends on all active maps
    function updateTrendsOnMaps(trends) {
        // Update 2D map
        const map2D = window.map2D;
        if (map2D && window.updateMineralizationTrendsWithData) {
            window.updateMineralizationTrendsWithData(map2D, trends);
        }
        
        // Update 3D map
        const map3D = window.map3D;
        if (map3D && window.updateMineralizationTrendsWithData) {
            window.updateMineralizationTrendsWithData(map3D, trends);
        }
    }
    
    // Clear trends on all maps
    function clearTrendsOnMaps() {
        const map2D = window.map2D;
        if (map2D && window.clearMineralizationTrends) {
            window.clearMineralizationTrends(map2D);
        }
        
        const map3D = window.map3D;
        if (map3D && window.clearMineralizationTrends) {
            window.clearMineralizationTrends(map3D);
        }
    }
    
    // Toggle trends visibility
    function toggleTrendsVisibility(visible) {
        const map2D = window.map2D;
        if (map2D && window.toggleMineralizationTrendsVisibility) {
            window.toggleMineralizationTrendsVisibility(map2D, visible);
        }
        
        const map3D = window.map3D;
        if (map3D && window.toggleMineralizationTrendsVisibility) {
            window.toggleMineralizationTrendsVisibility(map3D, visible);
        }
    }
    
    // Setup map refresh functionality
    function setupMapRefresh() {
        const refreshBtn = document.getElementById('refresh-map-btn');
        const refreshStatus = document.getElementById('refresh-status');
        
        if (!refreshBtn || !refreshStatus) {
            console.warn('Map refresh elements not found, skipping setup');
            return;
        }
        
        if (refreshBtn) {
            refreshBtn.addEventListener('click', async function() {
                // Disable button and show loading state
                refreshBtn.disabled = true;
                refreshBtn.innerHTML = `
                    <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Refreshing...
                `;
                refreshStatus.innerHTML = '<span class="text-blue-600">Refreshing map data...</span>';
                
                try {
                    // Call the global refresh function
                    if (window.refreshMap) {
                        window.refreshMap();
                        refreshStatus.innerHTML = '<span class="text-green-600">Map refreshed successfully!</span>';
                    } else {
                        refreshStatus.innerHTML = '<span class="text-red-600">Refresh function not available</span>';
                    }
                } catch (error) {
                    console.error('Error refreshing map:', error);
                    refreshStatus.innerHTML = '<span class="text-red-600">Error refreshing map</span>';
                } finally {
                    // Re-enable button and restore original state
                    setTimeout(() => {
                        refreshBtn.disabled = false;
                        refreshBtn.innerHTML = `
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            Refresh
                        `;
                        refreshStatus.innerHTML = '';
                    }, 2000);
                }
            });
        }
    }
    

</script>
{% endblock %}
