<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        .test-container { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .map-container { width: 100%; height: 400px; border: 2px solid #333; margin: 20px 0; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 4px; }
        .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 4px; }
        .info { color: blue; background: #e6f3ff; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Map Loading Test</h1>
    
    <div class="test-container">
        <h3>Environment Check</h3>
        <div id="env-status">Checking environment...</div>
    </div>
    
    <div class="test-container">
        <h3>Mapbox Script Loading</h3>
        <div id="script-status">Checking scripts...</div>
    </div>
    
    <div class="test-container">
        <h3>API Key Check</h3>
        <div id="api-status">Checking API key...</div>
    </div>
    
    <div class="test-container">
        <h3>Map Initialization</h3>
        <div id="map-status">Initializing map...</div>
        <div id="map-container" class="map-container">
            <div style="padding: 20px; text-align: center; color: #666;">
                Map will appear here if initialization is successful
            </div>
        </div>
    </div>

    <!-- Mapbox CSS and JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

    <script>
        // Test environment
        function testEnvironment() {
            const envStatus = document.getElementById('env-status');
            envStatus.innerHTML = `
                <div class="info">
                    <strong>Browser:</strong> ${navigator.userAgent}<br>
                    <strong>Window Size:</strong> ${window.innerWidth} x ${window.innerHeight}<br>
                    <strong>Document Ready:</strong> ${document.readyState}
                </div>
            `;
        }

        // Test script loading
        function testScripts() {
            const scriptStatus = document.getElementById('script-status');
            
            if (typeof mapboxgl === 'undefined') {
                scriptStatus.innerHTML = '<div class="error">❌ Mapbox GL JS failed to load</div>';
                return false;
            } else {
                scriptStatus.innerHTML = `
                    <div class="success">✅ Mapbox GL JS loaded successfully</div>
                    <div class="info">Version: ${mapboxgl.version || 'Unknown'}</div>
                `;
                return true;
            }
        }

        // Test API key
        function testAPIKey() {
            const apiStatus = document.getElementById('api-status');
            const apiKey = '{{ mapbox_api_key }}';
            
            if (!apiKey || apiKey === 'None') {
                apiStatus.innerHTML = '<div class="error">❌ Mapbox API key is missing</div>';
                return false;
            } else {
                apiStatus.innerHTML = `
                    <div class="success">✅ Mapbox API key is available</div>
                    <div class="info">Key starts with: ${apiKey.substring(0, 10)}...</div>
                `;
                return true;
            }
        }

        // Test map initialization
        function testMapInitialization() {
            const mapStatus = document.getElementById('map-status');
            const mapContainer = document.getElementById('map-container');
            
            try {
                // Set the access token
                mapboxgl.accessToken = '{{ mapbox_api_key }}';
                
                // Create a simple map
                const map = new mapboxgl.Map({
                    container: 'map-container',
                    style: 'mapbox://styles/mapbox/streets-v12',
                    center: [-59.45, 4.8], // Guyana coordinates
                    zoom: 8
                });
                
                map.on('load', function() {
                    mapStatus.innerHTML = '<div class="success">✅ Map loaded successfully!</div>';
                    mapContainer.innerHTML = ''; // Clear the placeholder
                });
                
                map.on('error', function(e) {
                    mapStatus.innerHTML = `<div class="error">❌ Map error: ${e.error.message}</div>`;
                });
                
            } catch (error) {
                mapStatus.innerHTML = `<div class="error">❌ Map initialization failed: ${error.message}</div>`;
            }
        }

        // Run all tests when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== MAP TEST PAGE LOADED ===');
            
            testEnvironment();
            testScripts();
            testAPIKey();
            
            // Wait a bit for scripts to load, then test map
            setTimeout(() => {
                if (typeof mapboxgl !== 'undefined') {
                    testMapInitialization();
                } else {
                    document.getElementById('map-status').innerHTML = '<div class="error">❌ Cannot test map - Mapbox not loaded</div>';
                }
            }, 1000);
        });
    </script>
</body>
</html>
